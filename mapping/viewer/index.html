<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>AGV 트랙 맵 뷰어</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500&family=IBM+Plex+Sans+KR:wght@400;500;600&display=swap">
<style>
/* 레이아웃: 왼쪽은 매트를 위에서 본 캔버스, 오른쪽은 요약·경고·선택·엣지·이벤트 패널. 좁으면 위아래로 쌓는다. */
:root {
  --bg: #eef1f4;
  --panel: #ffffff;
  --ink: #161a1f;
  --muted: #5b6573;
  --line: #d6dce4;
  --mat: #fbfcfd;
  --grid: #e6eaf0;
  --grid-major: #d3d9e2;
  --track: #1c1e21;
  --accent: #2c55c9;
  --accent-soft: #e3eaff;
  --warn: #a8640b;
  --warn-soft: #fff3df;
  --ok: #1e7a4a;
  --ok-soft: #e1f5ea;
  --bad: #b3261e;
  --sans: "IBM Plex Sans KR", "Apple SD Gothic Neo", "Malgun Gothic", system-ui, sans-serif;
  --mono: "IBM Plex Mono", ui-monospace, "SFMono-Regular", Menlo, Consolas, monospace;
  --patch-orange: #d8692a; --patch-yellow: #e6bd23; --patch-green: #34a86d;
  --patch-purple: #5d2b97; --patch-red: #c93a32; --patch-blue: #2f6fc0; --patch-other: #8a8f98;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #0e1115; --panel: #151a20; --ink: #e6e9ed; --muted: #98a2ae; --line: #29313b;
    --mat: #11161c; --grid: #1b2129; --grid-major: #252d37; --track: #d4d8dd;
    --accent: #84a2ff; --accent-soft: #1c2747; --warn: #f0b552; --warn-soft: #2e2413;
    --ok: #5fd096; --ok-soft: #13291e; --bad: #ff8a80; color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --bg: #0e1115; --panel: #151a20; --ink: #e6e9ed; --muted: #98a2ae; --line: #29313b;
  --mat: #11161c; --grid: #1b2129; --grid-major: #252d37; --track: #d4d8dd;
  --accent: #84a2ff; --accent-soft: #1c2747; --warn: #f0b552; --warn-soft: #2e2413;
  --ok: #5fd096; --ok-soft: #13291e; --bad: #ff8a80; color-scheme: dark;
}
[hidden] { display: none !important; }
html, body { height: 100%; }
body {
  margin: 0; background: var(--bg); color: var(--ink); font: 14px/1.5 var(--sans);
  display: flex; flex-direction: column;
}
.top {
  display: flex; flex-wrap: wrap; align-items: center; gap: 8px 16px;
  padding-block: 10px;
  padding-left: max(16px, env(safe-area-inset-left, 0px));
  padding-right: max(16px, env(safe-area-inset-right, 0px));
  background: var(--panel); border-bottom: 1px solid var(--line);
}
.top h1 { margin: 0; font-size: 16px; font-weight: 600; letter-spacing: -0.01em; }
.mapid { font-family: var(--mono); font-size: 13px; color: var(--muted); }
.spacer { flex: 1; }
.btn {
  font: 500 13px var(--sans); color: var(--ink); background: var(--panel);
  border: 1px solid var(--line); border-radius: 6px; padding: 5px 10px; cursor: pointer;
  display: inline-flex; align-items: center; gap: 6px; white-space: nowrap;
}
.btn:hover { border-color: var(--accent); }
.btn:focus-visible, input:focus-visible, select:focus-visible { outline: 2px solid var(--accent); outline-offset: 1px; }
.btn.primary { background: var(--accent); border-color: var(--accent); color: var(--panel); }
.btn.on { background: var(--accent-soft); border-color: var(--accent); }
.pill { font: 500 12px var(--sans); border-radius: 999px; padding: 2px 9px; white-space: nowrap; }
.pill.ok { background: var(--ok-soft); color: var(--ok); }
.pill.warn { background: var(--warn-soft); color: var(--warn); }
.pill.info { background: var(--accent-soft); color: var(--accent); }
main { flex: 1; min-height: 0; display: grid; grid-template-columns: minmax(0, 1fr) 380px; }
.stage { position: relative; min-width: 0; min-height: 0; background: var(--mat); overflow: hidden; touch-action: none; }
.stage svg { width: 100%; height: 100%; display: block; cursor: grab; user-select: none; }
.stage svg.panning { cursor: grabbing; }
.tools { position: absolute; top: 10px; left: 10px; display: flex; flex-wrap: wrap; gap: 6px; max-width: calc(100% - 20px); }
.foot {
  position: absolute; left: 10px; bottom: 10px; right: 10px; display: flex; flex-wrap: wrap;
  align-items: flex-end; gap: 8px 14px; pointer-events: none; font-size: 12px; color: var(--muted);
}
.foot > * { background: color-mix(in srgb, var(--panel) 88%, transparent); border: 1px solid var(--line); border-radius: 6px; padding: 4px 8px; }
.legend { display: flex; gap: 12px; flex-wrap: wrap; align-items: center; }
.legend svg { width: 14px; height: 14px; vertical-align: -2px; margin-right: 4px; }
.scalebar { display: flex; align-items: center; gap: 6px; font-family: var(--mono); }
.scalebar i { display: block; height: 6px; border: 1.5px solid var(--ink); border-top: 0; }
.drop {
  position: absolute; inset: 12px; border: 2px dashed var(--accent); border-radius: 10px;
  background: color-mix(in srgb, var(--accent-soft) 80%, transparent);
  display: grid; place-items: center; font-size: 15px; font-weight: 500; color: var(--accent);
}
.side { background: var(--panel); border-left: 1px solid var(--line); overflow-y: auto; min-width: 0; }
section { padding: 14px 16px; border-bottom: 1px solid var(--line); min-width: 0; }
section h2 {
  margin: 0 0 8px; font-size: 11px; font-weight: 600; letter-spacing: 0.08em;
  text-transform: uppercase; color: var(--muted); display: flex; align-items: center; gap: 8px;
}
dl.kv { display: grid; grid-template-columns: auto minmax(0, 1fr); gap: 3px 14px; margin: 0; }
dl.kv dt { color: var(--muted); }
dl.kv dd { margin: 0; font-family: var(--mono); font-size: 13px; overflow-wrap: anywhere; }
.counts { display: flex; flex-wrap: wrap; gap: 6px; margin-top: 10px; }
.warns { margin: 0; padding: 0; list-style: none; display: grid; gap: 6px; }
.warns li { background: var(--warn-soft); color: var(--ink); border-radius: 6px; padding: 6px 9px; font-size: 13px; border-left: 3px solid var(--warn); }
.empty { color: var(--muted); font-size: 13px; }
.tbl-wrap { overflow-x: auto; }
table { width: 100%; border-collapse: collapse; font-size: 12.5px; font-variant-numeric: tabular-nums; }
th { text-align: left; font-weight: 500; color: var(--muted); padding: 4px 6px; border-bottom: 1px solid var(--line); white-space: nowrap; }
td { padding: 4px 6px; border-bottom: 1px solid var(--grid); white-space: nowrap; }
td.mono, .mono { font-family: var(--mono); }
td.num { text-align: right; }
tr.row { cursor: pointer; }
tr.row:hover td { background: var(--accent-soft); }
tr.row.sel td { background: var(--accent-soft); color: var(--accent); }
.swatch { display: inline-block; width: 10px; height: 10px; border-radius: 2px; vertical-align: -1px; margin-right: 5px; }
pre.raw { margin: 8px 0 0; padding: 8px; background: var(--bg); border-radius: 6px; font: 11.5px/1.45 var(--mono); max-height: 220px; overflow: auto; white-space: pre; }
.bgctl { display: grid; grid-template-columns: auto minmax(0, 1fr); gap: 6px 10px; align-items: center; font-size: 13px; }
.bgctl input[type="number"] { width: 100%; box-sizing: border-box; font: 13px var(--mono); padding: 3px 6px; border: 1px solid var(--line); border-radius: 5px; background: var(--panel); color: var(--ink); }
.msg { margin: 8px 0 0; font-size: 13px; color: var(--bad); }
.hint { font-size: 12.5px; color: var(--muted); margin: 6px 0 0; }
svg text { font-family: var(--mono); }
.n-label { font-size: 42px; fill: var(--ink); paint-order: stroke; stroke: var(--mat); stroke-width: 10px; stroke-linejoin: round; }
.e-label { font-size: 34px; fill: var(--muted); paint-order: stroke; stroke: var(--mat); stroke-width: 9px; stroke-linejoin: round; }
.e-label.br { fill: var(--accent); font-weight: 500; }
g.node, g.edge { cursor: pointer; }
@media (max-width: 900px) {
  main { grid-template-columns: minmax(0, 1fr); grid-template-rows: minmax(360px, 58vh) auto; }
  .side { border-left: 0; border-top: 1px solid var(--line); overflow: visible; }
  body { height: auto; }
}
@media (prefers-reduced-motion: no-preference) { .btn { transition: border-color .12s; } }
</style>
</head>
<body>
<header class="top">
  <h1>AGV 트랙 맵 뷰어</h1>
  <span class="mapid" id="mapid">-</span>
  <span id="srcpill"></span>
  <span class="spacer"></span>
  <label class="btn primary" for="file">맵 JSON 열기</label>
  <input id="file" type="file" accept=".json,.jsonl,application/json" hidden>
</header>
<main>
  <div class="stage" id="stage">
    <svg id="svg" xmlns="http://www.w3.org/2000/svg" aria-label="트랙 맵">
      <defs>
        <pattern id="gridMinor" width="100" height="100" patternUnits="userSpaceOnUse">
          <path d="M100 0H0V100" fill="none" stroke="var(--grid)" stroke-width="2"/>
        </pattern>
        <pattern id="gridMajor" width="500" height="500" patternUnits="userSpaceOnUse">
          <rect width="500" height="500" fill="url(#gridMinor)"/>
          <path d="M500 0H0V500" fill="none" stroke="var(--grid-major)" stroke-width="3"/>
        </pattern>
      </defs>
      <rect id="gridRect" fill="url(#gridMajor)"/>
      <image id="bgimg" preserveAspectRatio="none" opacity="0.5"/>
      <g id="layerDropped"></g>
      <g id="layerEdges"></g>
      <g id="layerStubs"></g>
      <g id="layerNodes"></g>
    </svg>
    <div class="tools">
      <button class="btn" id="fit" type="button">전체 보기</button>
      <button class="btn" id="zin" type="button" aria-label="확대">+</button>
      <button class="btn" id="zout" type="button" aria-label="축소">−</button>
      <button class="btn on" id="tLabels" type="button">길이 표시</button>
      <button class="btn on" id="tDropped" type="button">제외된 엣지</button>
      <button class="btn" id="relayout" type="button">다시 배치</button>
    </div>
    <div class="foot">
      <span id="layoutNote"></span>
      <span class="legend">
        <span><svg viewBox="0 0 14 14"><rect x="1" y="1" width="12" height="12" rx="2" fill="var(--patch-orange)"/></svg>색 패치</span>
        <span><svg viewBox="0 0 14 14"><path d="M7 1L13 7L7 13L1 7Z" fill="var(--panel)" stroke="var(--ink)" stroke-width="1.6"/></svg>갈라짐</span>
        <span><svg viewBox="0 0 14 14"><circle cx="7" cy="7" r="5.5" fill="var(--panel)" stroke="var(--ink)" stroke-width="1.6"/><circle cx="7" cy="7" r="2" fill="var(--ink)"/></svg>합쳐짐</span>
        <span><svg viewBox="0 0 14 14"><path d="M1 7H13" stroke="var(--muted)" stroke-width="1.6" stroke-dasharray="3 2"/></svg>미탐색</span>
      </span>
      <span class="scalebar"><i id="sbar"></i><span id="sbarText"></span></span>
    </div>
    <div class="drop" id="drop" hidden>맵 JSON을 놓으세요</div>
  </div>
  <aside class="side">
    <section>
      <h2>요약</h2>
      <dl class="kv" id="summary"></dl>
      <div class="counts" id="counts"></div>
      <p class="msg" id="err" hidden></p>
    </section>
    <section>
      <h2>경고 <span id="warnCount"></span></h2>
      <ul class="warns" id="warns"></ul>
    </section>
    <section>
      <h2>선택한 항목</h2>
      <div id="detail"><p class="empty">맵에서 노드나 엣지를 누르면 자세한 값이 나와요. 노드는 끌어서 옮길 수 있어요.</p></div>
    </section>
    <section>
      <h2>엣지</h2>
      <div class="tbl-wrap"><table id="edgeTbl"></table></div>
    </section>
    <section>
      <h2>이벤트 로그 <span id="evFilter"></span></h2>
      <div class="tbl-wrap"><table id="evTbl"></table></div>
      <p class="hint" id="evHint"></p>
    </section>
    <section>
      <h2>배경 사진</h2>
      <div class="bgctl">
        <label for="bgfile">사진</label><input id="bgfile" type="file" accept="image/*">
        <label for="bgop">투명도</label><input id="bgop" type="range" min="0" max="1" step="0.05" value="0.5">
        <label for="bgw">사진 폭(mm)</label><input id="bgw" type="number" value="2000" step="10">
        <label for="bgx">왼쪽 x(mm)</label><input id="bgx" type="number" value="0" step="10">
        <label for="bgy">위쪽 y(mm)</label><input id="bgy" type="number" value="1500" step="10">
      </div>
      <p class="hint">매트를 위에서 찍어 반듯하게 편 사진을 깔고, 노드를 끌어 맞춰 보면서 맵이 맞는지 확인해요. 좌표가 없는 맵은 배치가 추정값이에요.</p>
    </section>
  </aside>
</main>

  function renderEvents() {
    var evs = (S.map.debug && S.map.debug.events) || [];
    var f = S.evNode, list = f ? evs.filter(function (e) { return e.node === f; }) : evs;
    $("evFilter").innerHTML = f ? '<span class="pill info">' + esc(f) + '</span> <button class="btn" type="button" id="evAll">전체 보기</button>' : "";
    if (f) $("evAll").onclick = function () { S.evNode = null; renderEvents(); };
    var shown = list.slice(0, 400);
    $("evTbl").innerHTML = "<thead><tr><th>로그</th><th>seq</th><th>종류</th><th>값</th><th>거리 mm</th><th>노드</th></tr></thead><tbody>" +
      shown.map(function (e) {
        return '<tr class="row' + (S.sel && S.sel.kind === "node" && S.sel.id === e.node ? " sel" : "") + '" data-node="' + esc(e.node) + '"><td class="mono">' + esc(e.run) + "/" + esc(e.seg) +
          '</td><td class="num mono">' + esc(e.seq) + "</td><td>" + esc(TYPE_KO[e.type] || e.type) + '</td><td class="mono">' + esc(e.detail) +
          '</td><td class="num mono">' + Math.round(e.d_mm) + '</td><td class="mono">' + esc(e.node) + "</td></tr>";
      }).join("") + "</tbody>";
    $("evHint").textContent = !evs.length ? "이 맵에는 debug.events가 없어요." :
      (list.length > shown.length ? "앞의 " + shown.length + "개만 보여요. " : "") + "행을 누르면 그 노드를 선택해요.";
  }
  $("evTbl").addEventListener("click", function (e) {
    var tr = e.target.closest("tr[data-node]"); if (tr) select({ kind: "node", id: tr.getAttribute("data-node") }, true);
  });

  function renderDetail() {
    var d = $("detail"), sel = S.sel;
    if (!sel) { d.innerHTML = '<p class="empty">맵에서 노드나 엣지를 누르면 자세한 값이 나와요. 노드는 끌어서 옮길 수 있어요.</p>'; return; }
    var obj, rows;
    if (sel.kind === "node") {
      obj = byId(sel.id); if (!obj) { d.innerHTML = ""; return; }
      var outs = S.map.edges.filter(function (e) { return e.from === obj.id; });
      var ins = S.map.edges.filter(function (e) { return e.to === obj.id; });
      rows = [["ID", obj.id], ["종류", (TYPE_KO[obj.type] || obj.type) + (obj.color ? " · " + obj.color : "")],
              ["지난 횟수", obj.visits], ["좌표", obj.pos ? obj.pos.join(", ") + " mm" : "없음"],
              ["들어오는 엣지", ins.map(function (e) { return e.id + "(" + e.from + ")"; }).join(", ") || "-"],
              ["나가는 엣지", outs.map(function (e) { return e.id + "→" + e.to + (e.branch ? "[" + e.branch + "]" : ""); }).join(", ") || "-"]];
      S.evNode = obj.id;
    } else {
      obj = S.map.edges.filter(function (e) { return e.id === sel.id; })[0]; if (!obj) { d.innerHTML = ""; return; }
      rows = [["ID", obj.id], ["경로", obj.from + " → " + obj.to], ["가지", obj.branch || "-"],
              ["길이", Math.round(obj.length_mm) + " ± " + Math.round(obj.length_std_mm || 0) + " mm (" + (obj.length_src || "-") + ")"],
              ["지난 횟수", obj.traversals], ["형상", obj.shape ? obj.shape.length + "점" : "없음"]];
    }
    var sw = obj.type === "patch" ? '<span class="swatch" style="background:' + patchVar(obj.color) + '"></span>' : "";
    d.innerHTML = sw + '<dl class="kv">' + kv(rows) + '</dl><pre class="raw">' + esc(JSON.stringify(obj, null, 1)) + "</pre>";
  }

  function select(sel, keepEvFilter) {
    S.sel = sel;
    if (!sel || sel.kind !== "node") { if (!keepEvFilter) S.evNode = null; }
    renderDetail(); renderEdges(); renderEvents(); draw();
  }

  function setMap(m) {
    S.map = m; S.sel = null; S.evNode = null;
    computeLayout(); renderSummary(); renderEdges(); renderEvents(); renderDetail(); draw(); fit();
  }

  // ---------- 배경 사진 ----------
  function applyBg() {
    var img = $("bgimg"), w = +$("bgw").value || 2000, x = +$("bgx").value || 0, y = +$("bgy").value || 0;
    img.setAttribute("opacity", $("bgop").value);
    if (!img.getAttribute("href")) return;
    var ratio = +img.getAttribute("data-ratio") || 0.75;
    img.setAttribute("x", x); img.setAttribute("y", -y); img.setAttribute("width", w); img.setAttribute("height", w * ratio);
  }
  $("bgfile").addEventListener("change", function (e) {
    var f = e.target.files[0]; if (!f) return;
    var r = new FileReader();
    r.onload = function () {
      var im = new Image();
      im.onload = function () { var b = $("bgimg"); b.setAttribute("href", r.result); b.setAttribute("data-ratio", im.height / im.width); applyBg(); };
      im.src = r.result;
    };
    r.readAsDataURL(f);
  });
  ["bgop", "bgw", "bgx", "bgy"].forEach(function (id) { $(id).addEventListener("input", applyBg); });

  window.addEventListener("resize", applyView);

  // ---------- 시작 ----------
  var sampleText = $("sample-map").textContent.trim(), started = false;
  try {
    var q = new URLSearchParams(location.search).get("map");
    if (q) {
      started = true;
      fetch(q).then(function (r) { if (!r.ok) throw new Error(r.status + " " + r.statusText); return r.text(); })
        .then(function (t) { loadText(t, q); })
        .catch(function (err) { showError(q + "를 불러오지 못했어요(" + err.message + "). 파일을 직접 열어 주세요."); });
    }
  } catch (e) { /* 쿼리 없음 */ }
  if (!started && sampleText && sampleText.charAt(0) === "{") {
    try { S.sample = true; setMap(JSON.parse(sampleText)); S.sample = true; renderSummary(); } catch (e) { S.sample = false; }
  }
  if (!S.map) { applyView(); $("summary").innerHTML = kv([["상태", "맵 JSON을 열거나 끌어다 놓으세요"]]); }
})();
</script>
</body>
</html>
